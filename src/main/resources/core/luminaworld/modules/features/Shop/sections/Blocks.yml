# =====================================================================
#                      หมวดหมู่ร้านค้า: บล็อก (Blocks)
# =====================================================================

# เปิดใช้งานหมวดหมู่นี้
enable: true

# ตำแหน่งสล็อตของหมวดหมู่นี้ในเมนูหลัก (/shop)
slot: 21

# หัวข้อหน้าต่างเมื่อเปิดเข้ามาในหมวดหมู่นี้
title: "&2&lหมวดหมู่บล็อกสร้างบ้าน"

# ซ่อนหมวดหมู่นี้จากเมนูหลักหรือไม่
hidden: false

# กำหนดเป็นหมวดหมู่ย่อยหรือไม่
sub-section: false

# กำหนดให้เป็นเพียงไอเทมโชว์ประดับเมนูหลักหรือไม่
display-item: false

# สกุลเงินหลักที่ใช้ชำระเงินในหมวดหมู่นี้ (1 หน้าร้าน 1 สกุลเงิน)
economy: "VAULT"

# ปิดเมนูร้านค้าทันทีเมื่อซื้อเสร็จสิ้นหรือไม่
close-menu: false

# คำสั่งพิเศษเบื้องหลังเมื่อคลิก
click-commands: []

# การตั้งค่าราคากลางผันผวน
dynamic-pricing:
  enabled: true
  max-stock: 10000
  buyPriceScaling: 150.0
  sellPriceScaling: 50.0

# ไอเทมเติมช่องว่างเพื่อความสวยงาม
fill-item:
  material: "GRAY_STAINED_GLASS_PANE"
  name: " "

# ปุ่มแสดงผลในหน้าเมนูหลัก (/shop)
item:
  material: "GRASS_BLOCK"
  name: "&2&lหมวดหมู่บล็อก (Blocks)"
  lore:
    - "&7รวมบล็อกดิน หิน ทราย ไม้ คอนกรีต"
    - "&7และวัสดุก่อสร้างพื้นฐานต่างๆ"
  enchantment-glint: false
  stack-size: 1

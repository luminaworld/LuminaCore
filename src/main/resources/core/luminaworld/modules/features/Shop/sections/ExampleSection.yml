# =====================================================================
#                 ตัวอย่างการตั้งค่าหมวดหมู่ร้านค้า (ExampleSection)
# =====================================================================
# ไฟล์ในโฟลเดอร์ /sections/ ใช้สำหรับกำหนดรายละเอียดปุ่มหมวดหมู่ที่จะไปโชว์ใน /shop
# ชื่อไฟล์นี้ (ExampleSection.yml) จะต้องตรงกับชื่อไฟล์ร้านค้าในโฟลเดอร์ shops (ExampleShop.yml)

# กำหนดว่าจะเปิดใช้งานหมวดหมู่นี้หรือไม่
enable: true

# ตำแหน่งสล็อตของปุ่มหมวดหมู่นี้ในเมนูหลัก (/shop)
slot: 22

# หัวข้อเมนูย่อยเมื่อผู้เล่นคลิกเข้ามาในหมวดหมู่นี้
title: "&e&lร้านค้าตัวอย่างพิเศษ"

# ซ่อนหมวดหมู่นี้จากเมนูหลักหรือไม่ (หากเป็น true จะต้องเข้าผ่าน /shop ExampleSection)
hidden: false

# กำหนดเป็นหมวดหมู่ย่อย (Sub-section) หรือไม่
sub-section: false

# กำหนดให้เป็นเพียงปุ่มประดับตกแต่งเมนู ไม่สามารถคลิกเข้าไปดูสินค้าข้างในได้หรือไม่
display-item: false

# สกุลเงินหลักที่ใช้ชำระค่าสินค้าภายในหมวดหมู่นี้ (1 หน้าร้าน 1 สกุลเงิน)
# รองรับค่า: "VAULT" (เงินหลัก), "EXP" (ค่าประสบการณ์เลเวล), "LUMINA:coins" (สกุลเงินพิเศษของ Lumina)
economy: "VAULT"

# เมื่อรันคำสั่งพิเศษตอนเข้าหน้าหมวดหมู่แล้ว จะต้องปิดหน้าเมนูร้านค้าทันทีหรือไม่
close-menu: false

# คำสั่งที่จะรันจากเบื้องหลังเมื่อผู้เล่นคลิกปุ่มหมวดหมู่นี้
click-commands: []

# การตั้งค่าราคากลางผันผวน (Dynamic Pricing) ประจำหมวดหมู่
dynamic-pricing:
  enabled: false
  max-stock: 1000
  buyPriceScaling: 100.0
  sellPriceScaling: 80.0

# ไอเทมสำหรับเติมสล็อตที่ว่างในหน้าร้านค้านี้เพื่อความสวยงาม
fill-item:
  material: "GRAY_STAINED_GLASS_PANE"
  name: " "

# ปุ่มแสดงผลหมวดหมู่ที่จะไปปรากฏในหน้าเมนูหลัก (/shop)
item:
  # ประเภทของไอเทมที่จะนำไปแสดง
  material: "BEACON"
  # ชื่อแสดงผลปุ่ม
  name: "&a&lหมวดหมู่ตัวอย่างพิเศษ (ไอเทมพิเศษ)"
  # คำอธิบายปุ่ม (Lore)
  lore:
    - "&7หมวดหมู่นี้รวมสินค้าสาธิต"
    - "&7เช่น ยาเวทมนตร์, ดาบ Custom NBT, และระบบคำสั่งเสกของ"
  # เปิดออร่าเรืองแสงให้กับปุ่มหรือไม่
  enchantment-glint: true
  # จำนวนสินค้าบนรูปปุ่ม
  stack-size: 1

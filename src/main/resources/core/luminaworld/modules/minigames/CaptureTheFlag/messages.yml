# =========================================================================
# Capture The Flag - Messages & GUI Configuration (ระบบภาษาและจัดการหน้าต่าง)
# =========================================================================

# ข้อความแจ้งเตือนแอดมินผ่านแชท
admin:
  no-permission: "%prefix% &cคุณไม่มีสิทธิ์เข้าถึงคำสั่งนี้!"
  only-player: "%prefix% &cคำสั่งนี้ใช้งานได้เฉพาะผู้เล่นในเกมเท่านั้น!"
  enter-zone-name: "%prefix% &cโปรดระบุชื่อพื้นที่ยึดครอง! (/ctf create <ชื่อ>)"
  zone-not-found: "%prefix% &cไม่พบพื้นที่ยึดครองชื่อ &e%zone%!"
  zone-exists: "%prefix% &cมีพื้นที่ยึดครองชื่อ &e%zone% &cในระบบอยู่แล้ว!"
  select-points-first: "%prefix% &cกรุณาเลือกตำแหน่ง pos1 และ pos2 ให้ครบถ้วนก่อนสร้างโซน!"
  world-mismatch: "%prefix% &cตำแหน่งมุมทั้งสองจุดต้องอยู่ใน World เดียวกัน!"
  pos1-set: "%prefix% &aกำหนดจุดที่ 1 สำเร็จที่ &eX=%x%, Y=%y%, Z=%z%"
  pos2-set: "%prefix% &aกำหนดจุดที่ 2 สำเร็จที่ &eX=%x%, Y=%y%, Z=%z%"
  create-success: "%prefix% &aสร้างพื้นที่ยึด &e%zone% &aสำเร็จและบันทึกลงไฟล์แล้ว!"
  create-center-success:
    "%prefix% &aสร้างพื้นที่จากจุดศูนย์กลาง &e%zone% &a(รัศมี
    %radius% บล็อก) สำเร็จแล้ว!"
  delete-success: "%prefix% &aลบพื้นที่ยึดครอง &e%zone% &aออกจากระบบและไฟล์ข้อมูลแล้ว"
  reload-success: "%prefix% &aรีโหลดข้อมูลและตั้งค่าของระบบ CTF ทั้งหมดสำเร็จแล้ว!"
  forcewin-success: "%prefix% &aบังคับให้ผู้เล่นยึดพื้นที่ &e%zone% &aสำเร็จเรียบร้อย!"
  forcecooldown-success: "%prefix% &aบังคับให้พื้นที่ &e%zone% &aเข้าสู่สถานะคูลดาวน์แล้ว!"
  enter-number: "%prefix% &cกรุณากรอกตัวเลขที่ถูกต้อง!"
  invalid-syntax:
    "%prefix% &cคำสั่งไม่ถูกต้อง! กรุณาใช้: &7/ctf pos1, pos2, create,
    createcenter, delete, list, reload"
  edit-display-y-success:
    "%prefix% &aแก้ไขความสูงแสดงผลพาทิเคิลของ &e%zone% &aสำเร็จเป็น
    Y=%y%"
  edit-min-y-success:
    "%prefix% &aแก้ไขขอบเขตความสูงตรวจจับต่ำสุดของ &e%zone% &aสำเร็จเป็น
    Y=%y%"
  edit-max-y-success:
    "%prefix% &aแก้ไขขอบเขตความสูงตรวจจับสูงสุดของ &e%zone% &aสำเร็จเป็น
    Y=%y%"

# การตั้งค่าหน้าตาและข้อความใน GUI (ไม่ใช้ตัวหนาและไม่มีอีโมจิ)
gui:
  # หน้าต่างแสดงรายการพื้นที่ (Main List)
  list:
    title: "&8จัดการพื้นที่ยึดครอง (CTF)"
    create-button:
      slot: 49
      material: EMERALD
      name: "&aสร้างพื้นที่ยึดครองใหม่"
      lore:
        - "&7คลิกที่นี่เพื่อสร้างพื้นที่ยึดครองใหม่"
        - "&7โดยพิกัดจะอ้างอิงจาก &ePOS1 &7และ &ePOS2"
        - "&7ที่คุณเคยใช้ไอเทมเลือกหรือพิมพ์เลือกไว้"
        - ""
        - "&eคลิกเพื่อสร้างโซนยึดครอง"
    close-button:
      slot: 53
      material: BARRIER
      name: "&cปิดหน้าต่าง"
      lore:
        - "&7คลิกเพื่อปิดเมนูจัดการ"
    zone-item:
      material: BEACON
      name: "&bพื้นที่ยึด: &e%zone%"
      lore:
        - "&8--------------------------------"
        - "&7• โลก: &f%world%"
        - "&7• พิกัด: &eX:%minx%..%maxx% &eZ:%minz%..%maxz%"
        - "&7• ความสูงตรวจจับ (Y): &e%miny%..%maxy%"
        - "&7• สถานะปัจจุบัน: %status%"
        - ""
        - "&aคลิกซ้ายเพื่อเปิดเมนูตั้งค่าสนาม"

  # หน้าต่างปรับแต่งและตั้งค่าโซนรายตัว (Editor GUI)
  editor:
    title: "&8จัดการโซน: %zone%"
    decor-material: GRAY_STAINED_GLASS_PANE

    # สล็อตปุ่มใน GUI Editor (ปรับสล็อต ย้ายสล็อต เปลี่ยนสไตล์ตามต้องการ)
    items:
      info:
        slot: 4
        material: BOOK
        name: "&6ข้อมูลโซน: &e%zone%"
        lore:
          - "&8--------------------------------"
          - "&7• โลก: &f%world%"
          - "&7• พิกัด X: &e%minx% ถึง %maxx%"
          - "&7• พิกัด Z: &e%minz% ถึง %maxz%"
          - "&7• ความสูงตรวจสอบ Y: &e%miny% ถึง %maxy%"
          - "&7• ความสูงแสดงพาทิเคิล Y: &e%displayy%"
          - "&7• เวลาคูลดาวน์ปัจจุบัน: &e%cooldown% วินาที"
          - "&7• สถานะ: %status%"
          - "&8--------------------------------"

      capture-time:
        slot: 10
        material: CLOCK
        name: "&eเวลาในการยึดครอง"
        lore:
          - "&7ระยะเวลาสะสมที่ผู้เล่นต้องยืนยึด"
          - "&7ค่าปัจจุบัน: &a%value% วินาที"
          - ""
          - "&eคลิกเพื่อแก้ไขเวลา"

      grace-period:
        slot: 11
        material: FEATHER
        name: "&6ช่วงเวลาผ่อนผัน (Grace Period)"
        lore:
          - "&7เวลารอผู้เล่นกลับเข้าจุดยึดก่อนจะรีเซ็ตค่า"
          - "&7ค่าปัจจุบัน: &a%value% วินาที"
          - ""
          - "&eคลิกเพื่อแก้ไขช่วงเวลา"

      cooldown-time:
        slot: 12
        material: COMPASS
        name: "&cระยะเวลาคูลดาวน์"
        lore:
          - "&7เวลาคูลดาวน์ของสนามหลังจากถูกยึดสำเร็จ"
          - "&7ค่าปัจจุบัน: &a%value% วินาที"
          - ""
          - "&eคลิกเพื่อแก้ไขเวลา"

      min-y:
        slot: 14
        material: IRON_BARS
        name: "&3พิกัด Y ต่ำสุดสำหรับตรวจจับ"
        lore:
          - "&7ความสูงต่ำสุดที่ผู้เล่นต้องยืนอยู่ระบบถึงนับคะแนน"
          - "&7ค่าปัจจุบัน: &a%value%"
          - ""
          - "&eคลิกเพื่อแก้ไขพิกัด Y ต่ำสุด"

      display-y:
        slot: 15
        material: GOLDEN_PICKAXE
        name: "&aระดับความสูงการแสดงผลพาทิเคิล (Y)"
        lore:
          - "&7ความสูง Y ที่พาทิเคิลจะเรนเดอร์แสดงผลขอบเขต"
          - "&7ค่าปัจจุบัน: &a%value% (Y)"
          - ""
          - "&eคลิกเพื่อแก้ไขความสูงแสดงผล"

      max-y:
        slot: 16
        material: CHAIN
        name: "&3พิกัด Y สูงสุดสำหรับตรวจจับ"
        lore:
          - "&7ความสูงสูงสุดที่ผู้เล่นต้องยืนอยู่ระบบถึงนับคะแนน"
          - "&7ค่าปัจจุบัน: &a%value%"
          - ""
          - "&eคลิกเพื่อแก้ไขพิกัด Y สูงสุด"

      rewards:
        slot: 13
        material: CHEST
        name: "&dคำสั่งและรางวัลการยึดครอง"
        lore:
          - "&7คำสั่งที่จะทำงานจาก Console เมื่อยึดสำเร็จ"
          - "&7รายการคำสั่งปัจจุบัน:"
          - "%commands%"
          - ""
          - "&dคลิกเพื่อเพิ่มคำสั่งรางวัล"
          - "&dShift + คลิก เพื่อล้างคำสั่งทั้งหมด"

      toggle-particles:
        slot: 19
        material: REDSTONE_LAMP
        name: "&eแสดงพาทิเคิลขอบเขตพื้นที่"
        lore:
          - "&7ตั้งค่าเปิด/ปิดการวาดพาทิเคิลบอกขอบเขต"
          - "&7สถานะปัจจุบัน: %status%"
          - ""
          - "&eคลิกเพื่อสลับเปิด/ปิด"

      particle-type:
        slot: 20
        material: FIREWORK_STAR
        name: "&6ชนิดของพาทิเคิลปกติ"
        lore:
          - "&7ชนิดพาทิเคิลหลัก (เช่น DUST, FLAME, CRIT)"
          - "&7ค่าปัจจุบัน: &a%value%"
          - ""
          - "&eคลิกเพื่อพิมพ์เปลี่ยนชนิดพาทิเคิล"

      particle-color:
        slot: 21
        material: PINK_DYE
        name: "&bสีพาทิเคิล HEX (ปกติ)"
        lore:
          - "&7รหัส HEX สีกรอบพาทิเคิลปกติ (เช่น #00FF80)"
          - "&7ค่าปัจจุบัน: &a%value%"
          - ""
          - "&bคลิกเพื่อแก้ไขรหัสสี HEX"

      particle-size:
        slot: 22
        material: SLIME_BALL
        name: "&aขนาดของพาทิเคิล DUST (ปกติ)"
        lore:
          - "&7ขนาดการสเกลพาทิเคิล (เฉพาะชนิด DUST เท่านั้น)"
          - "&7ค่าปัจจุบัน: &a%value%"
          - ""
          - "&eคลิกเพื่อระบุขนาดใหม่"

      height-offset:
        slot: 23
        material: PISTON
        name: "&7ความสูงลอยตัวเหนือระดับพื้น"
        lore:
          - "&7ความสูงในการลอยของพาทิเคิลเหนือ Display Y"
          - "&7ค่าปัจจุบัน: &a%value% บล็อก"
          - ""
          - "&eคลิกเพื่อระบุระดับลอยตัว"

      spawn-interval:
        slot: 24
        material: DISPENSER
        name: "&7หน่วงเวลาสปอนพาทิเคิลใหม่ (Interval)"
        lore:
          - "&7เวลาหน่วงการเกิดพาทิเคิลรอบถัดไป (วินาที)"
          - "&7(ถ้าตั้งเป็น 0.0 จะสปอนต่อเนื่องไม่หยุด)"
          - "&7ค่าปัจจุบัน: &a%value% วินาที"
          - ""
          - "&eคลิกเพื่อแก้ไขค่าหน่วงเวลา"

      duration:
        slot: 25
        material: DAYLIGHT_DETECTOR
        name: "&7ระยะเวลาแสดงผลของพาทิเคิล (Duration)"
        lore:
          - "&7ระยะเวลาที่พาทิเคิลจะสปอนอยู่ก่อนจะสลายตัว"
          - "&7(ถ้าตั้งเป็น 0.0 จะแสดงตลอดเวลา)"
          - "&7ค่าปัจจุบัน: &a%value% วินาที"
          - ""
          - "&eคลิกเพื่อแก้ไขระยะเวลาแสดงผล"

      hide-cooldown:
        slot: 29
        material: ENDER_EYE
        name: "&8ซ่อนพาทิเคิลตอนติดคูลดาวน์"
        lore:
          - "&7สลับสถานะว่าจะซ่อนพาทิเคิลเลยหรือไม่ตอนคูลดาวน์"
          - "&7สถานะปัจจุบัน: %status%"
          - ""
          - "&eคลิกเพื่อสลับตัวเลือก"

      cooldown-type:
        slot: 30
        material: BLAZE_POWDER
        name: "&cชนิดพาทิเคิลช่วงคูลดาวน์"
        lore:
          - "&7ชนิดพาทิเคิลตอนสนามคูลดาวน์ (เช่น DUST, SMOKE)"
          - "&7ค่าปัจจุบัน: &a%value%"
          - ""
          - "&eคลิกเพื่อเปลี่ยนชนิดพาทิเคิล"

      cooldown-color:
        slot: 31
        material: RED_DYE
        name: "&bสีพาทิเคิล HEX (ช่วงคูลดาวน์)"
        lore:
          - "&7รหัส HEX สีพาทิเคิลตอนสนามคูลดาวน์"
          - "&7ค่าปัจจุบัน: &a%value%"
          - ""
          - "&eคลิกเพื่อพิมพ์รหัส HEX สีคูลดาวน์"

      cooldown-size:
        slot: 32
        material: MAGMA_CREAM
        name: "&cขนาดพาทิเคิล DUST (ช่วงคูลดาวน์)"
        lore:
          - "&7ขนาดการสเกลพาทิเคิลช่วงคูลดาวน์ (เฉพาะ DUST)"
          - "&7ค่าปัจจุบัน: &a%value%"
          - ""
          - "&eคลิกเพื่อระบุขนาด"

      particle-density:
        slot: 33
        material: SUGAR
        name: "&fความหนาแน่นของพาทิเคิลขอบเขต"
        lore:
          - "&7ระยะห่างพาทิเคิลต่อบล็อก (ยิ่งน้อย ยิ่งละเอียดหนาแน่น)"
          - "&7ค่าปัจจุบัน: &a%value% บล็อก"
          - ""
          - "&eคลิกเพื่อเปลี่ยนระยะห่าง"

      force-win:
        slot: 39
        material: GOLDEN_APPLE
        name: "&aบังคับยึดพื้นที่สำเร็จ (Force Win)"
        lore:
          - "&7สั่งการบังคับให้ตนเองยึดโซนนี้ได้ทันที"
          - "&7และเริ่มกระตุ้นระบบรางวัลและการประกาศแชท"
          - ""
          - "&eคลิกซ้ายเพื่อบังคับยึดครอง"

      force-cooldown:
        slot: 40
        material: REDSTONE
        name: "&cบังคับเข้าสู่สถานะคูลดาวน์"
        lore:
          - "&7สั่งการบังคับให้สนามเริ่มนับถอยหลังคูลดาวน์"
          - "&7และหยุดสิทธิ์การเข้ายึดทั้งหมดชั่วคราว"
          - ""
          - "&eคลิกซ้ายเพื่อบังคับคูลดาวน์"

      delete-zone:
        slot: 41
        material: TNT
        name: "&4ลบพื้นที่ยึดครองนี้ถาวร"
        lore:
          - "&7ลบสนามยึดครองนี้ออกจากฐานข้อมูล"
          - "&cการลบนี้จะลบไฟล์ข้อมูลบนดิสก์และกู้คืนไม่ได้!"
          - ""
          - "&cคลิกซ้ายเพื่อลบโซนยึดครองทิ้งถาวร"

      back-button:
        slot: 45
        material: ARROW
        name: "&eย้อนกลับ"
        lore:
          - "&7กลับไปยังหน้ารายชื่อโซนยึดทั้งหมด"

# =========================================================================
# ChatGames - ตั้งค่าระบบ Chat Races (ภารกิจการแข่งขัน)
# =========================================================================

# เปิด/ปิดการทำงานของระบบภารกิจการแข่งขันทั้งหมด (Races)
enable-races: true

# สวิตช์เปิด/ปิดข้อความ Title การแข่งขันทั้งหมดแบบ Global
enable-title: false

# อนุญาตให้ผู้เล่นในโหมด Creative เข้าร่วมกิจกรรมและนับคะแนนได้
creative-enabled: true

# 1. hunt: ล่าเอนทิตี (มอนสเตอร์/สัตว์เลี้ยง) ตามประเภทและจำนวนที่กำหนด
hunt:
  enable: true
  enable-title: false # เปิด/ปิดการแสดงข้อความ Title เฉพาะหมวดหมู่นี้
  timeToComplete_seconds: 90
  count-spawner-mobs: true
  data:
    ZOMBIE:
      '3':
        rewards:
        - reward_1
    CREEPER:
      '3':
        rewards:
        - reward_1
    SKELETON:
      '3':
        rewards:
        - reward_1
    SPIDER:
      '3':
        rewards:
        - reward_1
    PIG:
      '3':
        rewards:
        - reward_1
    SHEEP:
      '3':
        rewards:
        - reward_1
    COW:
      '3':
        rewards:
        - reward_1
    CHICKEN:
      '3':
        rewards:
        - reward_1
    SALMON:
      '3':
        rewards:
        - reward_1
  gameStart:
    title: '&a&l- RACES STARTED -'
    subtitle: '&fเริ่มการแข่งขุด/ล่า/ตกปลา!'
    actionbar: '&eทำภารกิจที่ได้รับมอบหมายให้สำเร็จเป็นคนแรก!'
  winner:
    title: '&a&lมีผู้ชนะแล้ว!'
    subtitle: '&e%winner% &fทำภารกิจสำเร็จ!'
    actionbar: '&e%winner% &aชนะการแข่งขัน!'
  timeout:
    title: '&c&lหมดเวลา!'
    subtitle: '&7ไม่มีผู้สำเร็จภารกิจในรอบนี้'
    actionbar: '&cหมดเวลากิจกรรมการแข่งขันในรอบนี้!'


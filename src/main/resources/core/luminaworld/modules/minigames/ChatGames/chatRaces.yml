enable-races: true

# อนุญาตให้ผู้เล่นในโหมด Creative เข้าร่วมกิจกรรมและนับคะแนนได้
creative-enabled: true

# 1. hunt: ล่าเอนทิตี (มอนสเตอร์/สัตว์) ตามจำนวนที่กำหนด
hunt:
  enable: true
  timeToComplete_seconds: 90
  titleMessage: ''
  subtitleMessage: ''
  
  # นับสัตว์/มอนสเตอร์ที่เกิดจากกรงสปอว์น (Spawner) หรือไข่สปอว์น (Spawn Egg)
  count-spawner-mobs: true
  
  # รายชื่อมอนสเตอร์และเงื่อนไข (รูปแบบ: ID_มอนสเตอร์: จำนวนที่ต้องฆ่า)
  data:
    ZOMBIE:
      '3':
        rewards:
        - reward_1

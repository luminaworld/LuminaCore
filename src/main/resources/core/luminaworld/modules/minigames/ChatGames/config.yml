# =========================================================================
# ChatGames - การตั้งค่าระบบหลัก (Core Configuration)
# =========================================================================

# การตั้งค่าระบบแกนกลางของกิจกรรม ChatGames
settings:
  enabled: true

# รหัสภาษาสำหรับการแปลชื่อบล็อกและมอนสเตอร์ในการแข่งขัน (Default: en_us)
lang: 'en_us'

# คำนำหน้าข้อความแสดงในช่องแชท (Prefix)
prefix: '&x&7&4&F&F&8&3C&x&7&5&F&8&9&5H&x&7&6&F&2&A&6A&x&7&7&E&B&B&8T &x&7&A&D&D&D&CG&x&7&B&D&7&E&DA&x&7&C&D&0&F&FM&x&7&C&D&0&F&FE&x&7&C&D&0&F&FS'

# ชื่อตารางในฐานข้อมูลที่จะใช้เก็บข้อมูลคะแนนและสถิติของผู้เล่น
table_name: 'chatgames'

# โลกที่ระบบจะไม่อนุญาตให้เริ่มกิจกรรมสุ่มอัตโนมัติ
disabled-worlds:
  - example_world

# การควบคุม Log ของระบบ
log-file: 'game_log.txt'
log-console: true
log-local: false

# เงื่อนไขการจัดกิจกรรมสุ่มอัตโนมัติ
min_players_online: 1
time_minutes: 3
allow_starting_from_disabled: true
cancel-message-when-winning: true
use-permission-toplay: false
count-all-players: true

# ระบบสุ่มหน่วงเวลาช่วงกิจกรรมเริ่มรอบถัดไป
randomDelay:
  enable: false
  timeUnit: 'minutes'
  minimum: 1
  limit: 25

# ระบบส่งข้อมูลและสถิติขึ้น Discord Webhook
discord:
  webhook-url: ''
  message-content: 'ผลการแข่งขันล่าสุด:'
  img-url: 'https://www.spigotmc.org/data/resource_icons/107/107781.jpg?1676494289'
  username: 'Chat Games'
  title: 'ผลการแข่ง Chat Games'
  description: 'ผู้ชนะคือ:'
  winner-field: '%winner% (%time%)'
  game-field: 'เกม: %game%'

# ระบบเสียงเอฟเฟกต์ภายในกิจกรรม
GameSounds:
  volume: 1.0
  win: 'minecraft:entity.experience_orb.pickup'
  game-start: 'minecraft:entity.player.levelup'
  time-expired: 'minecraft:entity.villager.no'
  wrong-case: ''

# แสดง 10 อันดับผู้เล่นที่พิมพ์คำตอบเร็วที่สุด (/cg fastest)
fastest-typers-top: true

# สวิตช์เปิด/ปิดข้อความ Title กลางหน้าจอของกิจกรรมแชททั้งหมดแบบ Global
enable-title: false

# =========================================================================

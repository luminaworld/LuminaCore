# ==========================================
#          ChatGames - ตั้งค่าทั่วไป
# ==========================================

# ตั้งค่าทั่วไปของโมดูลย่อย
settings:
  # เปิด/ปิดการทำงานของระบบมินิเกม ChatGames ทั้งหมด (true = เปิด, false = ปิด)
  enabled: true

# รหัสภาษาสำหรับการแปลชื่อบล็อกและมอนสเตอร์ใน Race (สถิติ)
lang: en_us

# การส่งข้อมูลเข้า Discord Webhook
discord:
  # ใส่ URL ของ Webhook ที่นี่ (ปล่อยว่างเพื่อปิด)
  webhook-url: ''
  message-content: 'ผลการแข่งขันล่าสุด:'
  img-url: https://www.spigotmc.org/data/resource_icons/107/107781.jpg?1676494289
  username: Chat Games
  title: ผลการแข่ง Chat Games
  description: 'ผู้ชนะคือ:'
  winner-field: '%winner% (%time%)'
  game-field: 'เกม: %game%'

# ชื่อตารางในฐานข้อมูลที่จะเก็บข้อมูลคะแนนและสถิติ
table_name: chatgames

# โลกที่ไม่อนุญาตให้เริ่มกิจกรรม Chat Games
disabled-worlds:
- example_world

# คำนำหน้าข้อความแสดงในแชท (Prefix)
prefix: '&x&7&4&F&F&8&3C&x&7&5&F&8&9&5H&x&7&6&F&2&A&6A&x&7&7&E&B&B&8T &x&7&A&D&D&D&CG&x&7&B&D&7&E&DA&x&7&C&D&0&F&FM&x&7&C&D&0&F&FE&x&7&C&D&0&F&FS'

# ไฟล์สำหรับบันทึก Log กิจกรรม
log-file: game_log.txt

# อนุญาตให้พิมพ์ Log ลง Console ของเซิร์ฟเวอร์
log-console: true

# อนุญาตให้บันทึก Log ลงในไฟล์แบบโลคอล
log-local: false

# อนุญาตให้ผู้เล่นเริ่มเกมด้วยคำสั่งได้ แม้จะพิมพ์จากโลกที่ถูกแบน
allow_starting_from_disabled: true

# หากเป็น true ระบบจะลบข้อความคำตอบที่ถูกต้องของผู้เล่นไม่ให้แสดงในช่องแชทหลัก
cancel-message-when-winning: true

# จำนวนผู้เล่นออนไลน์ขั้นต่ำเพื่อเริ่มกิจกรรมสุ่มอัตโนมัติ
min_players_online: 1

# ระยะห่างการสุ่มเริ่มเกมใหม่ (นาที) ตั้งเป็น -1 เพื่อปิดระบบอัตโนมัติ
time_minutes: 3

# ใช้ระบบสุ่มระยะเวลาเริ่มเกมใหม่หลังจบเกมก่อนหน้า (หากเปิดใช้ จะข้ามการตั้งค่า time_minutes)
randomDelay:
  enable: false
  timeUnit: minutes # ตัวเลือก: minutes หรือ seconds
  minimum: 1
  limit: 25

# หากตั้งเป็น true ผู้เล่นต้องมีสิทธิ์ chatgames.play จึงจะเห็นและเข้าร่วมกิจกรรมได้
use-permission-toplay: false

# นับจำนวนผู้เล่นที่ออนไลน์ทั้งหมด (หากเป็น false จะนับเฉพาะผู้เล่นที่มีสิทธิ์เล่น)
count-all-players: true

# แสดง 10 อันดับผู้เล่นที่พิมพ์เร็วที่สุด (/cg fastest)
fastest-typers-top: true

# เสียงเอฟเฟกต์ (ปล่อยว่างเพื่อปิด)
GameSounds:
  volume: 1.0
  win: minecraft:entity.experience_orb.pickup
  game-start: minecraft:entity.player.levelup
  time-expired: minecraft:entity.villager.no
  wrong-case: ''


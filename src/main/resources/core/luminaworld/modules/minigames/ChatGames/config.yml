  winners: 1
  case-sensitive: true
  timeToGuess_seconds: 20
  gameStart:
    title: '&a&l- CHAT GAMES -'
    subtitle: '&fร่วมสนุกพิมพ์ตอบคำถามในแชท!'
    actionbar: '&eเริ่มเกมทายคำตอบแล้ว! พิมพ์ตอบรับรางวัล'
  winner:
    title: '&a&lมีผู้ชนะแล้ว!'
    subtitle: '&e%winner% &fตอบถูกต้อง!'
    actionbar: '&e%winner% &aตอบคำถามถูกต้อง!'

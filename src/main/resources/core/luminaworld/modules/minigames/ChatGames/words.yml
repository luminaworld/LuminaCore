trivia:
  data:
    1:
      question: 'ใครคือผู้สร้าง Minecraft?'
      answers:
        - 'Notch'
        - 'notch'
    2:
      question: 'เจ้าของ Minecraft ปัจจุบันคือใคร'
      answers:
        - 'microsoft'
        - 'Microsoft'
    3:
      question: 'ชื่อของเซิร์ฟเวอร์นี้อย่างย่อคืออะไร'
      answers:
        - 'Luminaris'
        - 'luminaris'
    4:
      question: 'ชื่อของเซิร์ฟเวอร์นี้เต็มๆคืออะไร'
      answers:
        - 'Legacy of Luminaris World'
        - 'legacy of luminaris world'
    5:
      question: 'ชื่อในเกมของเจ้าของเซิร์ฟเวอร์คืออะไร'
      answers:
        - 'Loma0531'
    6:
      question: '1 ปีมีกี่เดือน (ตอบเป็นเลข)'
      answers:
        - '12'
    7:
      question: '1 ปีมีกี่วัน (ตอบเป็นเลข)'
      answers:
        - '365'
        - '366'
    8:
      question: '1 ปีมีกี่สัปดาห์ (ตอบเป็นเลข)'
      answers:
        - '52'
    9:
      question: 'ลูกเต๋า 1 ลุกมีกี่ด้าน (ตอบเป็นเลข)'
      answers:
        - '6'
    10:
      question: 'แอดโลมาหล่อมั้ย (ใช่/ไม่)'
      answers:
        - 'ใช่'
        - 'ไม่'
    11:
      question: 'จงหาค่าของ limit เมื่อ x เข้าหา 3 ใน (2x + 1)'
      answers:
        - '7'
    12:
      question: 'รองเท้าอะไรหายากที่สุด'
      answers:
        - 'รองเท้าหาย'
    13:
      question: 'อะไรเอ่ยข้างหน้าเป็นขน ข้างหลังเป็นนม ผู้ใหญ่เห็นก็ชม เด็กเห็นก็ชอบ??'
      answers:
        - 'ขนม'
    14:
      question: 'อะไรเอ่ย อ้ายยาวกับอ้ายสั้น วิ่งแข่งกันทุกวันไปรอบๆ'
      answers:
        - 'นาฬิกา'
    15:
      question: 'อะไรเอ่ย มีหูมีตา แต่ไม่มีแขนไม่มีขา??'
      answers:
        - 'หม้อ'
    16:
      question: 'อะไรเอ่ย มีขามากกว่าคน แต่เดินไม่ได้ คลานไม่ได้'
      answers:
        - 'โต๊ะ'
        - 'เก้าอี้'
    17:
      question: 'อะไรเอ่ย มีฟันมากมาย แต่กินอะไรไม่ได้เลย??'
      answers:
        - 'หวี'
    18:
      question: 'ถนนอะไร ไม่มีสาย มีแต่เสียง??'
      answers:
        - 'ถนนวิทยุ'
    19:
      question: 'อะไรเอ่ย ขึ้นๆลงๆ แต่ก็ยังอยู่ที่เดิม ??'
      answers:
        - 'บรรไดเลื่อน'
        - 'ลิฟต์'
    20:
      question: 'อะไรเอ่ย แม่เฟ้าประตูห้อง ลูกไปท่องอยุ่ด้านนอก ลูกมาก็ไม่บอก หยอกแม่ก้นแทบพัง??'
      answers:
        - 'แม่กุญแจ'
        - 'ลูกกุญแจ'
    21:
      question: "มี 1, 2 และ 3 อันต่อไปจะเป็นอะไร"
      answers:
        - 'มังคุด'
    
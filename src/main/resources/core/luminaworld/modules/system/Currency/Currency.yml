  insufficient-funds: "&cยอดเงินของคุณไม่เพียงพอสำหรับการทำรายการ"
  transfer-disabled: "&cสกุลเงินนี้ถูกปิดการโอนระหว่างผู้เล่นชั่วคราว"
  self-transfer: "&cคุณไม่สามารถโอนเงินให้ตนเองได้"
  transfer-limit: "&cจำนวนเงินที่จะโอนอยู่นอกช่วงขั้นต่ำหรือสูงสุดที่กำหนดไว้"
  transaction-failed: "&cการทำธุรกรรมล้มเหลว กรุณาติดต่อทีมงานหรือลองใหม่อีกครั้ง"
  transfer-sent: "&aโอนเงินสกุล %currency% จำนวน %amount% ให้กับ %player% สำเร็จแล้ว"
  transfer-received: "&aคุณได้รับเงินสกุล %currency% จำนวน %amount% จากผู้เล่น %player%"
  balance: "&eผู้เล่น %player% มียอดเงินในระบบจำนวน %amount%"
  balance-usage: "&eรูปแบบการใช้งาน: /%balance_cmd% <สกุลเงิน> หรือ /%balance_cmd% <ชื่อผู้เล่น> <สกุลเงิน>"
  no-targets: "&cไม่พบเป้าหมายผู้เล่นตามที่ระบบค้นหา"
  admin-usage: "&eรูปแบบ: /%admin_cmd% <give|take|set> <ชื่อผู้เล่น|-all|-allonline|-alloffline> <สกุลเงิน> <จำนวน>"
  admin-success: "&aดำเนินการ %operation% เงินจำนวน %amount% ให้กับ %player% เรียบร้อยแล้ว"
  admin-success-bulk: "&aดำเนินการ %operation% เงินจำนวน %amount% ให้กับผู้เล่นจำนวน %count% คน สำเร็จเรียบร้อยแล้ว"
  transaction-failed-bulk: "&cการทำธุรกรรมล้มเหลวสำหรับผู้เล่นจำนวน %count% คน"
  help: "&e/%pay_cmd% <ชื่อผู้เล่น> <สกุลเงิน> <จำนวน>"

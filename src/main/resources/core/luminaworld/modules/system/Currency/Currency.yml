  recipient-offline: "&cไม่พบผู้เล่นปลายทาง หรือผู้เล่นดังกล่าวไม่ได้ออนไลน์อยู่"
  unknown-currency: "&cไม่พบสกุลเงินที่คุณระบุในระบบ"

  # - เมื่อถูกดำเนินการโดย Rcon / Console: "คุณได้รับเงินสกุล Coin จำนวน 1,000 Coin จากผู้ดูแลระบบ (Console)"
  admin-give-received: "&aคุณได้รับเงินสกุล %currency% จำนวน %amount% จากผู้ดูแลระบบ (%admin%)"
  admin-take-received: "&cคุณถูกหักเงินสกุล %currency% จำนวน %amount% โดยผู้ดูแลระบบ (%admin%)"
  admin-set-received: "&eยอดเงิน %currency% ของคุณถูกตั้งค่าเป็น %amount% โดยผู้ดูแลระบบ (%admin%)"

  # --- ข้อความแสดงตารางอันดับ (Leaderboard) ---
  leaderboard-header: "&6=== อันดับผู้เล่นที่มี %currency% สูงสุด %limit% อันดับแรก ==="
  leaderboard-format: "&e%index%. &f%player% &7- &a%amount%"
  leaderboard-empty: "&cไม่มีข้อมูลการจัดอันดับสำหรับสกุลเงินนี้"

# ----------------------------------------------------------------------------
# 4. คู่มือการใช้งาน PlaceholderAPI (Documentation)
# ----------------------------------------------------------------------------
# สามารถนำตัวแทนค่าเหล่านี้ไปใช้ในปลั๊กอินแสดงผลอื่นๆ (เช่น Scoreboard, Tablist)
# รูปแบบสากล: %luminacore_currency_<ไอดีสกุลเงิน>_<ค่าที่ต้องการดึง>%
#
# รายชื่อ Placeholders ที่รองรับ:
#
# 1. ยอดคงเหลือของผู้เล่น (Real-time):
#    - %luminacore_currency_<ไอดีสกุลเงิน>_balance%   -> แสดงยอดเงินดิบ เช่น 1500
#    - %luminacore_currency_<ไอดีสกุลเงิน>_formatted% -> แสดงแบบจัดรูปแบบ เช่น 1.5k Coin
#    - %luminacore_currency_<ไอดีสกุลเงิน>_short%     -> แสดงแบบย่อไม่มีสัญลักษณ์ เช่น 1.5k
#
# 2. ข้อมูลเบื้องต้นของสกุลเงิน:
#    - %luminacore_currency_<ไอดีสกุลเงิน>_name%          -> ชื่อของสกุลเงิน เช่น Coin
#    - %luminacore_currency_<ไอดีสกุลเงิน>_symbol%        -> สัญลักษณ์ของสกุลเงิน เช่น P
#    - %luminacore_currency_<ไอดีสกุลเงิน>_transferable%  -> สถานะการโอนเงิน (true / false)
#    - %luminacore_currency_count%                        -> จำนวนชนิดสกุลเงินทั้งหมดในระบบ
#
# 3. ข้อมูลจัดอันดับมหาเศรษฐี (Leaderboard) (อัปเดตตามระยะเวลาแคช):
#    - %luminacore_currency_<ไอดีสกุลเงิน>_top_name_<อันดับ>%      -> ชื่อผู้เล่นตามอันดับ เช่น Loma0531
#    - %luminacore_currency_<ไอดีสกุลเงิน>_top_balance_<อันดับ>%   -> ยอดเงินดิบของอันดับ เช่น 50000
#    - %luminacore_currency_<ไอดีสกุลเงิน>_top_formatted_<อันดับ>% -> ยอดจัดรูปแบบของอันดับ เช่น 50k Coin
#    - %luminacore_currency_<ไอดีสกุลเงิน>_top_short_<อันดับ>%     -> ยอดจัดรูปแบบย่อไม่มีสัญลักษณ์ เช่น 50k
#
# *หมายเหตุ: อันดับเริ่มต้นที่ 1 และรองรับสูงสุดตามที่ตั้งค่าใน leaderboard-cache-size
# ----------------------------------------------------------------------------

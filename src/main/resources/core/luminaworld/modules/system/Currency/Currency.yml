# ============================================================================
#               LuminaCore Currency Configuration (ระบบสกุลเงินหลัก)
# ============================================================================
# ไฟล์นี้ใช้สำหรับตั้งค่าระบบสกุลเงินที่แยกอิสระจากระบบ Vault ของเซิร์ฟเวอร์
# ทุกธุรกรรมการโอนเงินจะถูกบันทึกและจัดเก็บไว้ในฐานข้อมูลกลางของ LuminaCore
#
# คำสั่งลัดในการอัปเดตค่าหลังจากแก้ไขไฟล์นี้:
# - ในเกม/คอนโซล: /lc reload (ระบบจะอัปเดตการตั้งค่าและคำสั่งใหม่ทันที)
#
# *ข้อควรระวัง: ห้ามเปลี่ยนไอดีหลักของสกุลเงิน (เช่น coin, point) ที่มีผู้ใช้งานแล้ว
# เนื่องจากข้อมูลกระเป๋าเงินเดิมของผู้เล่นในฐานข้อมูลหลักจะผูกอยู่กับไอดีนั้นๆ
# ============================================================================

# ----------------------------------------------------------------------------
# 1. การตั้งค่าระบบทั่วไป (General Settings)
# ----------------------------------------------------------------------------
settings:
  # เปิด/ปิด การใช้งานโมดูล Currency ทั้งหมด (true = เปิด, false = ปิด)
  enabled: true

  # true  = ผู้รับปลายทางต้องออนไลน์อยู่ในเซิร์ฟเวอร์เท่านั้นจึงจะโอนเงินให้ได้ (แนะนำ)
  # false = อนุญาตให้โอนเงินหาผู้เล่นที่ออฟไลน์อยู่ได้ (ระบบจะอัปเดตยอดหลังผู้เล่นออนไลน์)
  require-recipient-online: true

  # คำสั่งย่อสำหรับตารางอันดับ (Leaderboard Command Aliases)
  leaderboard-command-aliases:
    - "baltop"
    - "moneytop"

  # --- ระบบแจ้งเตือนการทำธุรกรรม (Transaction Notifications) ---
  # ประเภทการแจ้งเตือนที่รองรับ:
  # - CHAT       : แสดงในช่องแชทปกติของเกม
  # - ACTION_BAR : แสดงบนแถบ Action Bar (เหนือช่องไอเทมด่วน)
  # - NONE       : ปิดการแจ้งเตือน ไม่ส่งข้อความใดๆ ให้ผู้เล่น
  notifications:
    # เมื่อผู้เล่นโอนเงินกันเอง (เช่น /lcpay)
    player-transfer:
      sender: "CHAT"
      receiver: "CHAT"
      
    # เมื่อ Admin ที่เป็นผู้เล่นในเกมใช้คำสั่งจัดการเงิน (เช่น /currencyadmin)
    admin-action:
      target: "CHAT"
      
    # เมื่อระบบผ่าน Console หรือปลั๊กอินอื่นใช้คำสั่งจัดการเงิน
    console-action:
      target: "ACTION_BAR"

# ----------------------------------------------------------------------------
# 2. การตั้งค่าสกุลเงิน (Currencies Definition)
# ----------------------------------------------------------------------------
# สามารถเพิ่มสกุลเงินใหม่ได้โดยสร้างไอดีใหม่ขึ้นมา (เช่น coin, point, token)
# *เงื่อนไขไอดี: ภาษาอังกฤษตัวพิมพ์เล็ก, ตัวเลข, _ หรือ - เท่านั้น (ความยาว 1-32 ตัวอักษร)
# ----------------------------------------------------------------------------
currencies:
  # ==================== ตัวอย่างที่ 1: สกุลเงิน Coin ====================
  coin:
    # ชื่อแสดงผลและสัญลักษณ์ของสกุลเงิน
    display-name: "Coin"
    symbol: "Coin"

    # จำนวนหลักทศนิยมที่รองรับ (0 ถึง 8)
    # หากระบุเป็น 0 ยอดเงินจะเป็นจำนวนเต็มทั้งหมด (เช่น 100 Coin)
    decimals: 0

    # true = อนุญาตให้ผู้เล่นโอนสกุลเงินนี้ให้กันได้, false = โอนไม่ได้ (เฉพาะแอดมินที่โอน/แจกได้)
    transferable: true

    # ป้องกันไม่ให้ผู้เล่นพิมพ์โอนเงินให้ตัวเอง
    allow-self-transfer: false

    # ข้อจำกัดในการโอนเงินต่อครั้ง ("0" = ไม่จำกัด)
    minimum-transfer: "1"
    maximum-transfer: "0"

    # ลิมิตยอดเงินคงเหลือสูงสุดและต่ำสุดในกระเป๋าเงิน ("0" = ไม่จำกัด)
    minimum-balance: "0"
    maximum-balance: "1000000000"

    # คำสั่งโอนเงินด่วนโดยเฉพาะสำหรับสกุลเงินนี้ (ตั้งเป็น "" หรือลบออกเพื่อยกเลิก)
    # เช่น พิมพ์ /cpay Loma0531 100 จะเป็นการโอน coin ให้ Loma0531 ทันที
    transfer-command: "cpay"
    command-aliases:
      - "coinpay"

    # --- ระบบ Permissions แบบละเอียดแยกสกุลเงิน ---
    # สิทธิ์การโอนเงิน (หากตั้งเป็น "" หรือเว้นว่าง = โอนได้ทุกคนโดยไม่ต้องมีสิทธิ์)
    permission-transfer: "luminacore.currency.coin.transfer"
    permission-transfer-require: true

    # สิทธิ์ในการรับเงินโอน (หากตั้งเป็น "" หรือเว้นว่าง = รับได้ทุกคนโดยไม่ต้องมีสิทธิ์)
    permission-receive: "luminacore.currency.coin.receive"
    permission-receive-require: true

    # สิทธิ์ในการดูยอดเงินตนเอง (หากตั้งเป็น "" หรือเว้นว่าง = ดูได้ทุกคน)
    permission-balance: ""
    permission-balance-require: false

    # สิทธิ์ในการดูยอดเงินผู้อื่น (หากตั้งเป็น "" หรือเว้นว่าง = ดูได้ทุกคน)
    permission-balance-other: "luminacore.currency.coin.balance.other"
    permission-balance-other-require: true

    # สิทธิ์ในการเปิดดูตารางอันดับมหาเศรษฐี (หากเป็น "" หรือเว้นว่าง = ดูได้ทุกคน)
    permission-leaderboard: "luminacore.currency.coin.leaderboard"
    # true = บังคับว่าต้องมีสิทธิ์ด้านบนเพื่อดูบอร์ดคะแนน, false = ไม่บังคับใช้
    permission-leaderboard-require: true

    # รูปแบบการแสดงผลของจำนวนเงินและสัญลักษณ์สกุลเงิน
    # คำหลักที่รองรับ: [money] (แสดงแบบเต็ม 1,500), [money_abbreviate] (แสดงตัวย่อ เช่น 1.5k), [symbol] (สัญลักษณ์)
    placing: "[money_abbreviate] [symbol]"

  # ==================== ตัวอย่างที่ 2: สกุลเงิน Point ====================
  point:
    # ชื่อแสดงผลและสัญลักษณ์ของสกุลเงิน
    display-name: "Point"
    symbol: "P"

    # จำนวนทศนิยมที่รองรับ (เช่น 2 หลัก จะทำให้เงินมีค่า เช่น 10.50 P)
    decimals: 2

    # การโอนเงินระหว่างผู้เล่นและการโอนหาตัวเอง
    transferable: true
    allow-self-transfer: false

    # ข้อจำกัดในการโอนเงินต่อครั้ง
    minimum-transfer: "0.1"
    maximum-transfer: "10000"

    # ลิมิตยอดเงินคงเหลือสูงสุดและต่ำสุดในกระเป๋าเงิน ("0" = ไม่จำกัด)
    minimum-balance: "0"
    maximum-balance: "0"

    # คำสั่งโอนเงินด่วนเฉพาะสกุลเงิน Point
    transfer-command: "pointpay"
    command-aliases: []

    # --- การกำหนดระบบ Permission เฉพาะของ Point ---
    permission-transfer: "luminacore.currency.point.transfer"
    permission-transfer-require: false

    permission-receive: ""
    permission-receive-require: false

    permission-balance: ""
    permission-balance-require: false

    permission-balance-other: "luminacore.currency.point.balance.other"
    permission-balance-other-require: false

    # สิทธิ์ในการเปิดดูตารางอันดับมหาเศรษฐี
    permission-leaderboard: "luminacore.currency.point.leaderboard"
    permission-leaderboard-require: false

    # รูปแบบการแสดงผล (เช่น 1,500.00 P)
    placing: "[money] [symbol]"

# ----------------------------------------------------------------------------
# 3. ข้อความแจ้งเตือนของระบบ (Messages Configuration)
# ----------------------------------------------------------------------------
# รองรับรหัสสีตกแต่งและตัวแปรไดนามิกต่างๆ ตามบริบท
# ----------------------------------------------------------------------------
messages:
  players-only: "&cคำสั่งนี้ใช้ได้เฉพาะผู้เล่นภายในเซิร์ฟเวอร์เท่านั้น"
  no-permission: "&cคุณไม่มีสิทธิ์ใช้งานคำสั่งนี้"

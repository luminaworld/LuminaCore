name: LuminaCore
version: "${version}"
main: core.luminaworld.LuminaCore
api-version: "1.20"
folia-supported: true
softdepend:
  - PlaceholderAPI
description: ปลั๊กอินควบคุมระบบและส่วนเสริมหลักของเซิร์ฟเวอร์ Luminaris
author: Loma0531




commands:
  luminacore:
    description: คำสั่งจัดการระบบหลักของ LuminaCore
    aliases:
      - luminaris
      - luminaworld
      - llw
      - lc
    permission: luminacore.admin
    usage: /<command> [reload]
  setting:
    description: ตั้งค่าระบบส่วนตัวของผู้เล่น
    aliases:
      - settings
  lcpay:
    description: โอนและจัดการสกุลเงินของ LuminaCore
    usage: /lcpay <player> <currency> <amount>
